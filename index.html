<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oficina Diesel DF - Atendimento Rápido</title>
  <meta name="description" content="Oficina diesel em Brasília. Atendimento rápido, diagnóstico completo e orçamento via WhatsApp.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#020617; color:#fff; font-family:Arial; }
    .hero { padding:120px 20px; text-align:center; background:linear-gradient(45deg,#020617,#0f172a); }
    .btn-main { background:#22c55e; border:none; }
    .card { background:#0f172a; border:1px solid #1e293b; border-radius:15px; }
    .form-control { background:#020617; border:1px solid #334155; color:#fff; }
    .badge-top { background:#22c55e; padding:5px 10px; border-radius:10px; }
  </style>
</head>
<body>

<section class="hero">
  <span class="badge-top">ATENDIMENTO IMEDIATO</span>
  <h1 class="mt-3">Oficina Diesel em Brasília</h1>
  <p>Seu caminhão com problema? Resolva agora.</p>
  <a href="#form" class="btn btn-main btn-lg">Solicitar Orçamento no WhatsApp</a>
</section>

<section class="container my-5">
  <div class="row text-center">
    <div class="col-md-4"><div class="card p-4"><h5>Diagnóstico Rápido</h5></div></div>
    <div class="col-md-4"><div class="card p-4"><h5>Especialistas Diesel</h5></div></div>
    <div class="col-md-4"><div class="card p-4"><h5>Garantia de Serviço</h5></div></div>
  </div>
</section>

<section id="form" class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card p-4">
        <h3 class="text-center">Peça seu orçamento</h3>
        <form id="leadForm">
          <input type="text" class="form-control my-2" placeholder="Seu nome" required>
          <input type="tel" class="form-control my-2" placeholder="Seu WhatsApp" required>
          <textarea class="form-control my-2" placeholder="Qual o problema?" required></textarea>
          <button class="btn btn-main w-100">Enviar agora</button>
        </form>
      </div>
    </div>
  </div>
</section>

<footer class="text-center p-4">
  <p>© 2026 Oficina Diesel DF</p>
</footer>

<script>
  document.getElementById('leadForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const nome = this.elements[0].value;
    const telefone = this.elements[1].value;
    const mensagem = this.elements[2].value;

    const texto = `Olá, meu nome é ${nome}. Meu WhatsApp: ${telefone}. Problema: ${mensagem}`;
    const url = `https://wa.me/5561995227446?text=${encodeURIComponent(texto)}`;

    window.open(url, '_blank');
  });
</script>

</body>
</html>
