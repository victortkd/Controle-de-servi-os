<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oficina App</title>
<style>
body { font-family: Arial; padding:20px; background:#020617; color:white; }

/* Inputs transparentes com texto branco */
input {
  width:100%;
  margin:5px 0;
  padding:10px;
  background: transparent;
  border:1px solid #334155;
  color:white;
}

input::placeholder {
  color:#94a3b8;
}

button { width:100%; margin:5px 0; padding:10px; cursor:pointer; }

.card { background:#0f172a; padding:15px; margin-top:10px; border-radius:10px; position:relative; }
#placa { text-transform: uppercase; }

.trash {
  position:absolute;
  top:10px;
  right:10px;
  cursor:pointer;
  font-size:18px;
}

.filtros button {
  width:auto;
  margin-right:5px;
  background:#1e293b;
  color:white;
  border:none;
  padding:8px;
}

.total {
  margin-top:15px;
  padding:10px;
  background:#0f172a;
  border-radius:10px;
}
</style>
</head>
<body>

<h2>Controle de Serviços</h2>

<input id="placa" placeholder="Placa">
<input id="servico" placeholder="Tipo de serviço">
<input id="valor" type="number" placeholder="Valor">
<input id="recebido" type="number" placeholder="Recebido">

<button onclick="salvar()">Salvar</button>

<div class="filtros">
  <button onclick="filtroAtual='todos'; render()">Todos</button>
  <button onclick="filtroAtual='pago'; render()">Pagos</button>
  <button onclick="filtroAtual='pendente'; render()">Pendentes</button>
</div>

<div class="total" id="totais"></div>

<div id="lista"></div>

<script>
let dados = JSON.parse(localStorage.getItem('dados')) || [];
let filtroAtual = 'todos';

function salvar(){
  let placa = document.getElementById('placa').value.toUpperCase();
  let servico = document.getElementById('servico').value;
  let valor = parseFloat(document.getElementById('valor').value);
  let recebido = parseFloat(document.getElementById('recebido').value);

  if(!placa || !servico || isNaN(valor) || isNaN(recebido)){
    alert("Preencha todos os campos corretamente");
    return;
  }

  let falta = valor - recebido;
  let status = falta <= 0 ? 'pago' : 'pendente';

  let item = {placa, servico, valor, recebido, falta, status};
  dados.push(item);

  localStorage.setItem('dados', JSON.stringify(dados));

  limpar();
  render();
}

function deletar(index){
  dados.splice(index,1);
  localStorage.setItem('dados', JSON.stringify(dados));
  render();
}

function limpar(){
  document.getElementById('placa').value = '';
  document.getElementById('servico').value = '';
  document.getElementById('valor').value = '';
  document.getElementById('recebido').value = '';
}

function render(){
  let lista = document.getElementById('lista');
  let totais = document.getElementById('totais');

  lista.innerHTML = '';

  let totalValor = 0;
  let totalRecebido = 0;
  let totalFalta = 0;

  dados.forEach((d, index) => {

    if(filtroAtual !== 'todos' && d.status !== filtroAtual) return;

    totalValor += d.valor;
    totalRecebido += d.recebido;
    totalFalta += d.falta;

    lista.innerHTML += `
      <div class="card">
        <div class="trash" onclick="deletar(${index})">🗑️</div>
        🚗 <strong>${d.placa}</strong><br>
        🔧 ${d.servico}<br>
        💰 Valor: R$${d.valor}<br>
        ✔ Recebido: R$${d.recebido}<br>
        ❌ Falta: R$${d.falta}<br>
        📊 Status: ${d.status}
      </div>
    `;
  });

  totais.innerHTML = `
    💰 Total Serviços: R$${totalValor.toFixed(2)}<br>
    ✔ Total Recebido: R$${totalRecebido.toFixed(2)}<br>
    ❌ Total Pendente: R$${totalFalta.toFixed(2)}
  `;
}

render();
</script>

</body>
</html>
