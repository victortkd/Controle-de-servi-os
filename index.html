<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oficina App</title>
<style>
body { font-family: Arial; padding:20px; background:#020617; color:white; }
input, button { width:100%; margin:5px 0; padding:10px; }
.card { background:#0f172a; padding:10px; margin-top:10px; border-radius:10px; }
button { cursor:pointer; }
.delete { background:#ef4444; color:white; border:none; margin-top:10px; }
/* Força placa em maiúsculo */
#placa { text-transform: uppercase; }
</style>
</head>
<body>

<h2>Controle de Serviços</h2>

<input id="placa" placeholder="Placa">
<input id="servico" placeholder="Tipo de serviço">
<input id="valor" type="number" placeholder="Valor">
<input id="recebido" type="number" placeholder="Recebido">

<button onclick="salvar()">Salvar</button>

<div id="lista"></div>

<script>
let dados = JSON.parse(localStorage.getItem('dados')) || [];

function salvar(){
  let placa = document.getElementById('placa').value.toUpperCase();
  let servico = document.getElementById('servico').value;
  let valor = parseFloat(document.getElementById('valor').value);
  let recebido = parseFloat(document.getElementById('recebido').value);

  if(!placa || !servico || isNaN(valor) || isNaN(recebido)){
    alert("Preencha todos os campos corretamente");
    return;
  }

  let falta = valor - recebido;

  let item = {placa, servico, valor, recebido, falta};
  dados.push(item);

  localStorage.setItem('dados', JSON.stringify(dados));

  limpar();
  render();
}

function deletar(index){
  dados.splice(index,1);
  localStorage.setItem('dados', JSON.stringify(dados));
  render();
}

function limpar(){
  document.getElementById('placa').value = '';
  document.getElementById('servico').value = '';
  document.getElementById('valor').value = '';
  document.getElementById('recebido').value = '';
}

function render(){
  let lista = document.getElementById('lista');
  lista.innerHTML = '';

  dados.forEach((d, index) => {
    lista.innerHTML += `
      <div class="card">
        🚗 <strong>${d.placa}</strong><br>
        🔧 ${d.servico}<br>
        💰 Valor: R$${d.valor}<br>
        ✔ Recebido: R$${d.recebido}<br>
        ❌ Falta: R$${d.falta}
        <button class="delete" onclick="deletar(${index})">Excluir</button>
      </div>
    `;
  });
}

render();
</script>

</body>
</html>
